[project]
name = "keri-bench"
version = "0.1.0"
description = "A stack-agnostic instrument that measures end-to-end KERI+ACDC issuance (Utah KERI-006)."
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
keri-bench = "keri_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "pytest-asyncio>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keri_bench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/keri_bench"]
# Synthetic-stack and fake-peer processes are this package's code too.
patch = ["subprocess"]
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == .__main__.:']
