[project]
name = "keri-bench"
version = "0.1.0"
description = "A stack-agnostic instrument that measures end-to-end KERI+ACDC issuance (Utah KERI-006)."
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.10",
    "httpx>=0.27",
    # httpcore imports sniffio on every request and, when it is absent, pays a failed import
    # (a filesystem search) each time: measured at over a second of CPU per 20-request-per-second
    # run, which showed up as driver lag.
    "sniffio>=1.3",
]

[project.optional-dependencies]
# The real stack's adapters (imbu issuer; heti witness pool, Observer, holder and verifier). Kept
# out of the core so the harness, the synthetic stack and CI's calibration need no private repo.
# Pinned to commits: imbu utah/next 317ae49 (2026-11-19), which stamps constructed and
# registry_updated on its issuance operations, and the heti it pins, 12e6f41 (this.i 2wventxp);
# before it imbu utah/next bb6ac45 (2026-11-05), and the heti it pins, a830fcd, which
# maps the demo witnesses' stores like every other and fixes the Observer's and issuer's restarts
# (store-limits-2, this.i 8ujhdv9k); before it e912ec4b and fc25249, which map every store at
# 16 GiB (heti-lmdb-mapsize, this.i 5nvt7d4g), on top of witness-kel-growth-2's
# kept witness cursors, seal-index anchor lookup and paged batches and heti-dead-lane's bounded
# witness lanes (7wvv745c); before it eda942c6 and 70c7d8e, and 7ff15e6a and 3a8b1ccb
# (0v5zd44x, 5c8ks2lq). Targets 1, 2, 4 and 5 of
# docs/targets-2026-10-rerun.md ran at imbu 2c3b072 and heti 1ae3590 (5frsx7pu). The Registrar
# (bakobo/witness) runs in its own uvx environment, as the summit harness runs it, because it pins
# a different keripy.
stacks = [
    "imbu @ git+ssh://git@github.com/bakobo/imbu@317ae49017e44ad617422b1b485e8100dfb02d15",
    "heti @ git+ssh://git@github.com/bakobo/heti@12e6f418672eb171322e2080b145eec1c95fef49",
]

[project.scripts]
keri-bench = "keri_bench.cli:main"

# imbu 670a3d8 depends on overture, whose own [tool.uv.sources] pins WebOfTrust keripy and would
# collide with heti's bakobo keripy, which contains it. Stating overture's requirements here, as
# imbu's pyproject does, stops uv reading its sources and leaves heti's keripy the only one. They
# must match overture's [project] dependencies at the commit imbu pins.
[tool.uv]
dependency-metadata = [
    { name = "overture", version = "0.1.0.dev0", requires-dist = ["keri", "jsonschema>=4.26", "falcon>=4.3"] },
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-asyncio>=1.0",
    # tools/site_source.py renders each page as the site will, to check it; pinned to the versions
    # the site group's Zensical resolves, so the check sees the same output the site publishes.
    "markdown==3.11.3",
    "pymdown-extensions==13.1",
]
# The documentation site's generator (this.i 2j423x8t), kept out of the harness's dependencies and
# out of dev. Zensical is pre-1.0, so it is pinned exactly; see zensical.toml.
site = [
    "zensical==0.0.69",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/keri_bench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# tools/ (the site source assembler) is imported from the repository root, as scripts/ runs it.
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["src/keri_bench", "tools"]
# Synthetic-stack and fake-peer processes are this package's code too.
patch = ["subprocess"]
parallel = true
sigterm = true
# The real stacks' code needs private repositories, so it has its own coverage run and
# configuration (tests/stacks/coveragerc), in its own CI job.
omit = ["src/keri_bench/stacks/*"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == .__main__.:']
