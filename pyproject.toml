[project]
name = "keri-bench"
version = "0.1.0"
description = "A stack-agnostic instrument that measures end-to-end KERI+ACDC issuance (Utah KERI-006)."
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.10",
    "httpx>=0.27",
    # httpcore imports sniffio on every request and, when it is absent, pays a failed import
    # (a filesystem search) each time: measured at over a second of CPU per 20-request-per-second
    # run, which showed up as driver lag.
    "sniffio>=1.3",
]

[project.optional-dependencies]
# The real stack's adapters (imbu issuer; heti witness pool, Observer, holder and verifier). Kept
# out of the core so the harness, the synthetic stack and CI's calibration need no private repo.
# Pinned to commits: imbu utah/next 2c3b072 (2026-10-31: imbu-kel-growth's bounded backlog,
# which answers 503 with Retry-After past it, on top of 670a3d8's Prefer: wait, answer budget and
# publication without the issuer KEL; this.i 5frsx7pu, 7kmhh4wr), and heti 1e6839bc, which
# descends from the 1ae3590 imbu pins and adds heti-consumer-kel's incremental replay of an
# issuer's KEL, heti-observer-gap's retried refused heads and witness-kel-growth's
# per-witness refresh (overridden below; this.i 53kz99e2,
# 8wsdm5fz). The Registrar
# (bakobo/witness) runs in its own uvx environment, as the summit harness runs it, because it pins
# a different keripy.
stacks = [
    "imbu @ git+ssh://git@github.com/bakobo/imbu@2c3b07271f22e490dfac74ced5948fbcf1d0f311",
    "heti @ git+ssh://git@github.com/bakobo/heti@1e6839bc77028271b44551108cd154b2d08f2d27",
]

[project.scripts]
keri-bench = "keri_bench.cli:main"

# imbu 670a3d8 depends on overture, whose own [tool.uv.sources] pins WebOfTrust keripy and would
# collide with heti's bakobo keripy, which contains it. Stating overture's requirements here, as
# imbu's pyproject does, stops uv reading its sources and leaves heti's keripy the only one. They
# must match overture's [project] dependencies at the commit imbu pins.
[tool.uv]
# Target 3's reruns run a later heti under imbu 2c3b072, which pins heti 1ae3590: 980ee85
# (heti-consumer-kel, this.i 53kz99e2), and now 1e6839bc (heti-observer-gap and witness-kel-growth, this.i 8wsdm5fz),
# each descending from it. This override is the only difference.
override-dependencies = [
    "heti @ git+ssh://git@github.com/bakobo/heti@1e6839bc77028271b44551108cd154b2d08f2d27",
]
dependency-metadata = [
    { name = "overture", version = "0.1.0.dev0", requires-dist = ["keri", "jsonschema>=4.26", "falcon>=4.3"] },
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "pytest-asyncio>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/keri_bench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/keri_bench"]
# Synthetic-stack and fake-peer processes are this package's code too.
patch = ["subprocess"]
parallel = true
sigterm = true
# The real stacks' code needs private repositories, so it has its own coverage run and
# configuration (tests/stacks/coveragerc), in its own CI job.
omit = ["src/keri_bench/stacks/*"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == .__main__.:']
