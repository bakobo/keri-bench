# The imbu stack at one home (docs/test-plan.md, Topologies). Needs `uv sync --extra stacks`
# and imbu's asynchronous operations (plan item imbu-async).
scenario_schema = 1
name = "imbu-smoke"
description = "One home of the imbu stack at a low steady rate: the KERI-006 smoke run and the real adapters' contract run."
stages = ["issue", "deliver", "present", "verify", "revoke", "sync"]

[recognition]
poll_ms = 250.0
stable_polls = 2

[load]
rates = [1.0]
duration_s = 5.0
warmup_s = 0.0
drain_s = 180.0
repetitions = 3
measure = ["requested", "verified"]

[roles.witness_pool]
adapter = "heti.witness_pool"
[roles.witness_pool.knobs]
knob_schema = 1
count = 3

[roles.state_distribution]
adapter = "registrar.state_distribution"
[roles.state_distribution.knobs]
knob_schema = 1
window_s = 2.0
delivery_timeout_s = 1.0
resync_s = 6.0

[roles.issuer]
adapter = "imbu.issuer"
[roles.issuer.knobs]
knob_schema = 1
toad = 2
poll_ms = 50.0
operation_timeout_s = 60.0

[roles.holder]
adapter = "heti.holder"
[roles.holder.knobs]
knob_schema = 1
toad = 2

[roles.verifier]
adapter = "heti.verifier"
[roles.verifier.knobs]
knob_schema = 1
toad = 2
freshness_s = 30.0
retry_ms = 250.0
deadline_s = 60.0

