# hsm-sweep of today's imbu (bench-baseline-2). Needs `uv sync --extra stacks`.
# The grid is recorded in this.i 02fe3uk5 and 0v8kmser, and the signer in 2p26rn9h.
scenario_schema = 1
name = "hsm-5ms"
description = "Issuance only through an external signer at 5 ms per signature, uncapped, stepped to saturation."
stages = ["issue"]

[load]
rates = [0.25, 0.5, 0.75, 1.0, 1.5]
duration_s = 60.0
warmup_s = 10.0
drain_s = 120.0
repetitions = 3
measure = ["requested", "witnessed"]

[statistics]
lag_limit_ms = 25.0

[roles.witness_pool]
adapter = "heti.witness_pool"
[roles.witness_pool.knobs]
knob_schema = 1
count = 3

[roles.state_distribution]
adapter = "registrar.state_distribution"
[roles.state_distribution.knobs]
knob_schema = 1
window_s = 2.0
delivery_timeout_s = 1.0
resync_s = 6.0

[roles.issuer]
adapter = "imbu.issuer"
[roles.issuer.knobs]
knob_schema = 3
toad = 2
poll_ms = 50.0
operation_timeout_s = 60.0
homes = 1
clients = 1
signer = "external"
signer_latency_ms = 5.0
signer_rate = "n/a"

[roles.holder]
adapter = "heti.holder"
[roles.holder.knobs]
knob_schema = 1
toad = 2

[roles.verifier]
adapter = "heti.verifier"
[roles.verifier.knobs]
knob_schema = 1
toad = 2
freshness_s = 30.0
retry_ms = 250.0
deadline_s = 60.0
