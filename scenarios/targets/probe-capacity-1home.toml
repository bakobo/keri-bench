# Today's imbu against Utah's stated targets (bench-targets). Needs `uv sync --extra stacks`.
# Every size here is a choice recorded in this.i under 4j5395l8 and its children.
scenario_schema = 1
name = "probe-capacity-1home"
description = "Probe: issuance only at 1 home(s), 4 clients each, waiting client, deployed Registrar window."
stages = ["issue"]

[load]
rates = [1.0, 1.5, 2.0, 2.8]
duration_s = 60.0
warmup_s = 10.0
drain_s = 120.0
repetitions = 3
measure = ["requested", "witnessed"]

[statistics]
lag_limit_ms = 25.0

[soak]
bucket = 50
per_credentials = 1000
sample_s = 30.0

[roles.witness_pool]
adapter = "heti.witness_pool"
[roles.witness_pool.knobs]
knob_schema = 1
count = 3

[roles.state_distribution]
adapter = "registrar.state_distribution"
[roles.state_distribution.knobs]
knob_schema = 1
window_s = 900.0
delivery_timeout_s = 450.0
resync_s = 2700.0

[roles.issuer]
adapter = "imbu.issuer"
[roles.issuer.knobs]
knob_schema = 4
toad = 2
poll_ms = "n/a"
wait_s = 25.0
answer_rate = 2.0
answer_burst = 20
operation_timeout_s = 60.0
homes = 1
clients = 4
signer = "lockbox"
signer_latency_ms = "n/a"
signer_rate = "n/a"

[roles.holder]
adapter = "heti.holder"
[roles.holder.knobs]
knob_schema = 1
toad = 2

[roles.verifier]
adapter = "heti.verifier"
[roles.verifier.knobs]
knob_schema = 1
toad = 2
freshness_s = 900.0
retry_ms = 5000.0
deadline_s = 1200.0
