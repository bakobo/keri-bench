# Today's imbu against Utah's stated targets (bench-targets). Needs `uv sync --extra stacks`.
# Every size here is a choice recorded in this.i under 4j5395l8; otherwise the baseline's (82r8lxy5).
scenario_schema = 1
name = "crash-issuer-1home"
description = "The lifecycle to verified at the rate one home's lifecycle sustains, one home, crashing issuer at 20 s."
stages = ["issue", "deliver", "present", "verify"]

[load]
rates = [0.6]
duration_s = 60.0
warmup_s = 0.0
drain_s = 120.0
repetitions = 3
measure = ["requested", "verified"]

[statistics]
lag_limit_ms = 25.0

[roles.witness_pool]
adapter = "heti.witness_pool"
[roles.witness_pool.knobs]
knob_schema = 1
count = 3

[roles.state_distribution]
adapter = "registrar.state_distribution"
[roles.state_distribution.knobs]
knob_schema = 1
window_s = 2.0
delivery_timeout_s = 1.0
resync_s = 6.0

[roles.issuer]
adapter = "imbu.issuer"
[roles.issuer.knobs]
knob_schema = 4
toad = 2
poll_ms = "n/a"
wait_s = 25.0
answer_rate = 2.0
answer_burst = 20
operation_timeout_s = 60.0
homes = 1
clients = 1
signer = "lockbox"
signer_latency_ms = "n/a"
signer_rate = "n/a"

[roles.holder]
adapter = "heti.holder"
[roles.holder.knobs]
knob_schema = 1
toad = 2

[roles.verifier]
adapter = "heti.verifier"
[roles.verifier.knobs]
knob_schema = 1
toad = 2
freshness_s = 30.0
retry_ms = 250.0
deadline_s = 60.0

[[faults]]
kind = "crash"
target = "issuer"
at_s = 20.0
