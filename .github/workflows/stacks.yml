name: Stacks

# The real stacks' adapters (docs/test-plan.md, Part B #10): their tests and the imbu stack end to
# end, weekly and on demand, against the stack versions pyproject.toml pins. A stack that drifted
# from what its adapter declares fails here. imbu and heti are private, so the Bakobo Dependency
# Reader App mints a short-lived read token; client-id is public, and only the private key is a
# secret, which expires on its own rather than needing rotation.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stacks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # persist-credentials:false is load-bearing: a persisted extraheader carrying this repo's
      # GITHUB_TOKEN would beat the App token the insteadOf rewrite puts in the URL.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Mint a token for private intra-org dependencies
        id: dep-reader
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liAQRlNEpCyR1RXt
          private-key: ${{ secrets.DEP_READER_PRIVATE_KEY }}
          owner: bakobo
          repositories: |
            imbu
            heti
      - name: Authenticate git for private intra-org dependencies
        env:
          TOKEN: ${{ steps.dep-reader.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
      # Separates "the credential is broken" from "the build is broken".
      - name: Verify private dependency access
        run: |
          git ls-remote ssh://git@github.com/bakobo/imbu HEAD > /dev/null
          git ls-remote ssh://git@github.com/bakobo/heti HEAD > /dev/null
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Install, with the stacks extra, from the lock
        run: uv sync --frozen --extra stacks
      - name: Real-stack tests at 100% branch coverage
        run: >
          uv run pytest -rs tests/stacks --cov --cov-config=tests/stacks/coveragerc
          --cov-fail-under=100
