name: CI

# Part B of docs/test-plan.md on every change: the unit and run tests, the adapter contract suite
# against the synthetic adapters, and the calibration (Part B #1) live at its bounds gate and
# replayed at its strict gate, at 100% branch coverage.
# Nothing here needs a private repository; the real adapters' weekly contract run is separate. Job
# `site` builds the documentation site as pages.yml does, without deploying, so a broken link or
# raw HTML in a page fails here rather than at the deploy (this.i 2j423x8t).

on:
  # Every push and every pull request. Since keri-bench went public, main's ruleset requires a pull
  # request whose test and site jobs passed (dev/standards/oss-posture.md item 7), so work no
  # longer lands on main without one.
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.14"
      - name: Install
        run: uv sync --locked
      - name: Test, with the calibration and the contract suite
        run: uv run pytest -q --cov --cov-report=term-missing --cov-fail-under=100
      # The bounds gate: a shared runner's load moves the two-sided bars, so those are held on the
      # recorded calibration in the suite and on the bench host (this.i 0hykugwr). The budget
      # this step measures is still kept.
      - name: Calibrate, and keep the error budget
        if: always()
        run: uv run keri-bench calibrate --gate bounds --out runs/calibration
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: calibration
          path: runs/calibration/calibration.json
          if-no-files-found: warn

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Sync the harness and the site generator
        run: uv sync --locked --group site
      - name: Assemble the site source
        run: uv run python scripts/site-source
      - name: Build the site
        run: uv run zensical build --clean --strict
