name: CI

# Part B of docs/test-plan.md on every change: the unit and run tests, the adapter contract suite
# against the synthetic adapters, and the calibration (Part B #1), at 100% branch coverage.
# Nothing here needs a private repository; the real adapters' weekly contract run is separate.

on:
  # Every branch, because work on keri-bench lands on main without a pull request (pr-merge land),
  # so a topic branch's CI is the only run before it lands.
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.14"
      - name: Install
        run: uv sync --locked
      - name: Test, with the calibration and the contract suite
        run: uv run pytest -q --cov --cov-report=term-missing --cov-fail-under=100
      - name: Calibrate, and keep the error budget
        if: always()
        run: uv run keri-bench calibrate --out runs/calibration
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: calibration
          path: runs/calibration/calibration.json
          if-no-files-found: warn
